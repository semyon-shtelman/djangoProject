{% extends 'blog/base.html' %}

{% block title %}Удалить Пост{% endblock %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Удалить Пост</h1>
    <p>Вы уверены, что хотите удалить "{{ post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
