{% extends 'blog/base.html' %}

{% block title %}Форма{% endblock %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Форма создания поста</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
